[project]
name = "vtb-test-task"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.60.0",
    "pdfplumber>=0.11.0",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
